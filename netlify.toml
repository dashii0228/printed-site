[build]
command = "pnpm run typecheck:libs && pnpm --filter @workspace/multi-page-site run build"
publish = "artifacts/multi-page-site/dist/public"

[build.environment]
BASE_PATH = "/"
NODE_VERSION = "22"
PORT = "26129"

[functions]
directory = "artifacts/api-server/netlify/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
